name: Build & Deploy ESP Hub

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

          if ls sketches/esp8266/*/*.ino >/dev/null 2>&1; then
            arduino-cli core install esp8266:esp8266
          fi

          if ls sketches/esp32/*/*.ino sketches/esp32c3/*/*.ino sketches/esp32s3/*/*.ino >/dev/null 2>&1; then
            arduino-cli core install esp32:esp32
          fi

          arduino-cli lib install "Adafruit GFX Library" "Adafruit ST7735 and ST7789 Library"

      - name: Build sketches and generate manifests
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p public/bin public/manifests
          cp index.html public/index.html

          build_chip() {
            local folder=$1 fqbn=$2 family=$3 ext=$4
            for dir in sketches/$folder/*/; do
              name=$(basename "$dir")
              mkdir -p "public/bin/$folder/$name"
              arduino-cli compile --fqbn "$fqbn" --output-dir "public/bin/$folder/$name" "$dir"
              printf '{"name":"%s","version":"1.0.0","new_install_prompt_erase":true,"builds":[{"chipFamily":"%s","parts":[{"path":"../bin/%s/%s/%s%s","offset":0}]}]}\n' \
                "$name" "$family" "$folder" "$name" "$name" "$ext" > "public/manifests/${folder}_${name}.json"
            done
          }

          build_chip "esp8266" "esp8266:esp8266:nodemcuv2" "ESP8266" ".ino.bin"
          build_chip "esp32"   "esp32:esp32:esp32"         "ESP32"   ".ino.merged.bin"
          build_chip "esp32c3" "esp32:esp32:esp32c3:CDCOnBoot=cdc" "ESP32-C3" ".ino.merged.bin"
          build_chip "esp32s3" "esp32:esp32:esp32s3:CDCOnBoot=cdc" "ESP32-S3" ".ino.merged.bin"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
