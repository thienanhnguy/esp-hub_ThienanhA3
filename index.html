    header {

      backdrop-filter: blur(10px);

    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
    }
    .channel {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #ec4899);
      border: 3px solid #f472b6;

      justify-content: center;
      font-weight: 700;

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

      margin: 0;
      font-size: 1.35rem;
      color: #831843;
      line-height: 1.3;
    }
    .channel p {
      margin: 4px 0 0;
      color: #9d4e73;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab {
      background: #fce7f3;
      color: #9d174d;
      border: 1px solid #f9a8d4;
      padding: 8px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tab.active {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 3px 10px rgba(236, 72, 153, 0.3);
    }
    .search {
      background: #fff;
      border: 1.5px solid #f9a8d4;
      color: #4a1530;
      padding: 9px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      width: 260px;
      max-width: 100%;
      outline: none;
    }
    .search::placeholder {
      color: #c084a4;
    }
    .search:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
    }

    main {
      max-width: 1120px;
      margin: 22px auto;
      padding: 0 16px 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      border: 1.5px solid #fbcfe8;
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(236, 72, 153, 0.1);
    }
    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #f9a8d4 0%, #fbcfe8 50%, #f5d0fe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      overflow: hidden;
    }
    .thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-title {
      position: relative;
      font-weight: 700;
      font-size: 1.15rem;
      color: #831843;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    }
    .badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .badge.ESP8266 { border: 1.5px solid #10b981; color: #059669; }
    .badge.ESP32-C3 { border: 1.5px solid #3b82f6; color: #2563eb; }
    .badge.ESP32 { border: 1.5px solid #f59e0b; color: #d97706; }
    .badge.ESP32-S3 { border: 1.5px solid #a855f7; color: #7e22ce; }

      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #6b2b4a;
    }
    summary {
      cursor: pointer;
      font-weight: 700;
      color: #be185d;
    }
    .pinout {
      margin-top: 8px;
      white-space: pre-line;

      color: #5b2340;
      font-weight: 600;
    }

      flex-direction: column;
      gap: 8px;
