<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kho Nạp Code ESP</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
    }
    header {
      background: #181818;
      border-bottom: 1px solid #272727;
      padding: 20px 16px;
    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
    }
    .channel {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff0033, #ff6b00);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .channel h1 { margin: 0; font-size: 1.35rem; }
    .channel p { margin: 4px 0 0; color: #aaa; font-size: 0.9rem; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab {
      background: #272727;
      color: #f1f1f1;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: #f1f1f1;
      color: #0f0f0f;
    }
    .search {
      background: #121212;
      border: 1px solid #303030;
      color: #fff;
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      width: 260px;
      max-width: 100%;
    }
    main {
      max-width: 1120px;
      margin: 20px auto;
      padding: 0 16px 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
    }
    .card {
      background: #181818;
      border: 1px solid #272727;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      overflow: hidden;
    }
    .thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-title {
      position: relative;
      font-weight: 700;
      font-size: 1.1rem;
      color: #e2e8f0;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(0,0,0,0.82);
      color: #fff;
    }
    .badge.ESP8266 { border: 1px solid #10b981; color: #34d399; }
    .badge.ESP32-C3 { border: 1px solid #3b82f6; color: #60a5fa; }
    .badge.ESP32 { border: 1px solid #f59e0b; color: #fbbf24; }
    .badge.ESP32-S3 { border: 1px solid #a855f7; color: #c084fc; }

    .body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .title {
      margin: 0 0 6px;
      font-size: 1.05rem;
      line-height: 1.35;
    }
    .desc {
      margin: 0 0 12px;
      font-size: 0.88rem;
      color: #aaa;
      line-height: 1.45;
    }
    details {
      background: #121212;
      border: 1px solid #272727;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 0.84rem;
      color: #ccc;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      color: #e2e8f0;
    }
    .pinout {
      margin-top: 8px;
      white-space: pre-line;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-flash {
      width: 100%;
      background: #ff0033;
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-flash:hover { background: #d9002b; }
    .btn-yt {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #272727;
      color: #f1f1f1;
      padding: 9px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      color: #888;
      padding: 40px 0;
    }
    .unsupported-msg {
      display: block;
      font-size: 0.8rem;
      color: #f87171;
      text-align: center;
      padding: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="channel">
        <div class="avatar">ESP</div>
        <div>
          <h1>Kho Nạp Code ESP</h1>
          <p>Cắm mạch vào máy tính (Chrome/Edge) → Chọn dự án → Chọn COM &amp; Nạp</p>
        </div>
      </div>

      <div class="controls">
        <div class="tabs" id="tabs">
          <button class="tab active" data-chip="ALL">Tất cả</button>
          <button class="tab" data-chip="ESP8266">ESP8266</button>
          <button class="tab" data-chip="ESP32">ESP32</button>
          <button class="tab" data-chip="ESP32-C3">ESP32-C3</button>
          <button class="tab" data-chip="ESP32-S3">ESP32-S3</button>
        </div>
        <input type="text" id="search" class="search" placeholder="Tìm dự án..." />
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    const PROJECTS = [
      {
        title: "Gửi ảnh lên màn hình ST7735 qua WiFi",
        chip: "ESP8266",
        manifest: "./manifests/esp8266_tft_anh.json",
        desc: "Phát WiFi ESP-TFT, vào 192.168.4.1 chọn ảnh, kéo zoom và gửi thẳng lên màn hình 160x128.",
        pinout: "WiFi: ESP-TFT | Pass: 12345678 | IP: 192.168.4.1\n• CS → D8 (GPIO15)\n• DC → D4 (GPIO2)\n• RST → D0 (GPIO16)\n• SCL → D5 | SDA → D7 | BLK → 3V3",
        thumb: "",
        video: ""
      }
    ];

    let currentChip = "ALL";
    let keyword = "";
    const grid = document.getElementById("grid");

    function render() {
      const list = PROJECTS.filter(p => {
        const matchChip = currentChip === "ALL" || p.chip === currentChip;
        const text = (p.title + " " + p.desc + " " + p.chip).toLowerCase();
        return matchChip && text.includes(keyword);
      });

      grid.innerHTML = "";
      if (!list.length) {
        grid.innerHTML = '<div class="empty">Chưa có dự án nào trong mục này.</div>';
        return;
      }

      list.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb">
            ${p.thumb ? `<img src="${p.thumb}" alt="${p.title}">` : `<div class="thumb-title">${p.title}</div>`}
            <span class="badge ${p.chip}">${p.chip}</span>
          </div>
          <div class="body">
            <h2 class="title">${p.title}</h2>
            <p class="desc">${p.desc}</p>
            <details>
              <summary>Xem sơ đồ chân &amp; thông tin</summary>
              <div class="pinout">${p.pinout}</div>
            </details>
            <div class="actions">
              <esp-web-install-button manifest="${p.manifest}">
                <button slot="activate" class="btn-flash">Chọn cổng COM &amp; Nạp</button>
                <span slot="unsupported" class="unsupported-msg">Mở bằng Chrome/Edge trên máy tính để nạp</span>
              </esp-web-install-button>
              ${p.video ? `<a class="btn-yt" href="${p.video}" target="_blank">Xem video hướng dẫn</a>` : ""}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("tabs").addEventListener("click", e => {
      if (!e.target.classList.contains("tab")) return;
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");
      currentChip = e.target.dataset.chip;
      render();
    });

    document.getElementById("search").addEventListener("input", e => {
      keyword = e.target.value.trim().toLowerCase();
      render();
    });

    render();
  </script>
</body>
</html>
